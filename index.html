<body>
<header><a class="brand" href="#" aria-label="stdio.mx, inicio">stdio.mx<span>✳</span></a><nav aria-label="Navegación"><button id="about-button">Mauricio</button><button id="catalog-button">☷ <span>Inventario</span></button></nav></header>
<main><section class="game-section" aria-label="Mundo interactivo de Mauricio">
<div class="game-toolbar"><span id="room-name">01 / ESTUDIO</span><span id="progress">0 / 5 LUGARES</span></div>
<div class="map-frame" id="map-frame"><div id="game" tabindex="0" role="group" aria-label="Mundo jugable. Toca un objeto para descubrirlo. Desliza para avanzar. Usa flechas o WASD para caminar y E para interactuar."></div><div id="map-labels" aria-label="Lugares del mundo"></div><div id="loading" role="status"><strong>Entrando a stdio.mx…</strong></div><div class="map-welcome" id="welcome"><span>ESTE MUNDO SE EXPLORA</span><p>Toca un objeto. Descubre lo que hago.</p><button id="dismiss-welcome">Vamos ↓</button></div><button class="secret" id="secret" aria-label="Investigar la estrella del estudio">✦</button></div>
<div class="game-bottom"><p id="map-status" role="status">Toca el suelo para caminar.</p><button id="interact" disabled>DESCUBRIR <kbd>E</kbd></button></div>
<div class="touch-controls" aria-label="Controles de movimiento"><button data-direction="up" aria-label="Caminar hacia arriba">↑</button><div><button data-direction="left" aria-label="Caminar a la izquierda">←</button><button data-direction="down" aria-label="Caminar hacia abajo">↓</button><button data-direction="right" aria-label="Caminar a la derecha">→</button></div></div>
<div class="world-options"><button id="reset-position" aria-label="Volver al estudio">↺</button><button id="sound" aria-pressed="false" aria-label="Activar sonidos">SONIDO OFF</button><button id="night" aria-pressed="false">☾ LUZ</button></div>
<button id="advance" class="explore-cue">DESLIZA PARA EXPLORAR <span>↓</span></button>
</section>
<section class="catalog-section" id="catalog" hidden aria-label="Inventario de proyectos"><button id="close-catalog" class="close-catalog">Volver al mundo ✕</button><div class="catalog-heading"><div><p class="eyebrow">INVENTARIO / STDIO.MX</p><h2>Lo que hay en este mundo.</h2></div><span id="catalog-count"></span></div><div class="catalog-controls"><div id="filters" role="group" aria-label="Filtrar catálogo"><button data-filter="all" aria-pressed="true">Todo</button><button data-filter="Proyecto" aria-pressed="false">Proyectos</button><button data-filter="Herramienta" aria-pressed="false">Herramientas</button><button data-filter="Lectura" aria-pressed="false">Lecturas</button></div><label class="search-label"><span class="sr-only">Buscar en el catálogo</span><input id="search" type="search" placeholder="Busca una idea…"></label></div><div id="catalog-grid" class="catalog-grid"></div><p id="catalog-empty" hidden>No encontré resultados. Prueba otro nombre o categoría.</p><p id="catalog-error" role="alert" hidden>No se pudo cargar el catálogo. <button id="retry-catalog">Volver a intentar</button></p></section>
